<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría & Gestión - Verifik Shield</title>
  
  <!-- Leaflet CSS Mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 30px; }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .badge-pill {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 { font-size: 22px; margin-top: 5px; }

    .btn-refresh {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-refresh:hover { background: #1d4ed8; }

    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #1f2937;
      color: var(--text-muted);
      padding: 14px 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:hover { background: rgba(255, 255, 255, 0.02); }

    .merchant-name { font-weight: bold; color: #fff; font-size: 14px; }
    .merchant-link { color: var(--accent); text-decoration: none; font-size: 11px; }

    .btn-map {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }

    .btn-map:hover { background: var(--accent); color: #000; }

    select {
      background: #111827;
      color: #fff;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }

    /* Modal de Mapa */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      padding: 20px;
    }

    #map { height: 320px; border-radius: 8px; margin: 15px 0; border: 1px solid var(--border); }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-cancel { background: #374151; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    .btn-save { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header-container">
    <div>
      <span class="badge-pill">PANEL DE CONTROL</span>
      <h1>Auditoría & Gestión Verifik Shield</h1>
    </div>
    <button class="btn-refresh" onclick="loadMerchants()">Actualizar Datos</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Comercio / ID</th>
          <th>RIF & Propietario</th>
          <th>Pago Móvil</th>
          <th>Ubicación / Mapa</th>
          <th>Nivel de Seguridad</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="merchants-table">
        <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Cargando comercios...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Modal Mapa -->
  <div class="modal-overlay" id="mapModal">
    <div class="modal-card">
      <h3 id="modalTitle">📍 Geolocalizar Comercio</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">
        Haz clic en el mapa de Maturín o arrastra el marcador para fijar la ubicación exacta.
      </p>

      <div id="map"></div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
        <div>
          <label style="font-size: 11px; color: var(--text-muted);">Latitud</label>
          <input type="text" id="latInput" readonly style="width: 100%; padding: 6px; background: #1f2937; color: #fff; border: 1px solid var(--border); border-radius: 4px;" />
        </div>
        <div>
          <label style="font-size: 11px; color: var(--text-muted);">Longitud</label>
          <input type="text" id="lngInput" readonly style="width: 100%; padding: 6px; background: #1f2937; color: #fff; border: 1px solid var(--border); border-radius: 4px;" />
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-save" onclick="saveLocation()">Guardar Coordenadas</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map = null;
    let marker = null;
    let activeMerchant = null;

    // Coordenadas iniciales: Maturín, Venezuela
    const MATURIN_LAT = 9.7457;
    const MATURIN_LNG = -63.1832;

    document.addEventListener('DOMContentLoaded', loadMerchants);

    async function loadMerchants() {
      try {
        const res = await fetch('/api/merchants');
        const result = await res.json();
        if (result.success) {
          renderTable(result.data);
        }
      } catch (err) {
        console.error('Error al cargar datos:', err);
      }
    }

    function renderTable(merchants) {
      const tbody = document.getElementById('merchants-table');
      tbody.innerHTML = '';

      merchants.forEach(m => {
        const tr = document.createElement('tr');
        const hasCoords = m.latitud && m.longitud;

        // Recuperar información de Pago Móvil probando todas las variaciones de nombres de columna
        const banco = m.banco_pago_r || m.banco_pago || m.banco || '';
        const cedula = m.cedula_pago_r || m.cedula_pago || m.cedula || '';
        const telefono = m.telefono_pago_r || m.telefono_pago || m.telefono || '';

        let pagoMovilTexto = 'No registrado';
        if (banco || cedula || telefono) {
          pagoMovilTexto = `${banco} ${cedula ? '- ' + cedula : ''} ${telefono ? '(' + telefono + ')' : ''}`.trim();
        }

        const slug = m.tienda ? m.tienda.toLowerCase().replace(/\s+/g, '-') : '';

        tr.innerHTML = `
          <td>
            <div class="merchant-name">${m.tienda || 'Sin Nombre'}</div>
            <a href="/verify?id=${slug}" class="merchant-link" target="_blank">/verify?id=${slug}</a>
          </td>
          <td>
            <div>${m.rif || 'Sin RIF'}</div>
            <div style="color: var(--text-muted); font-size: 11px;">${m.propietario || 'No especificado'}</div>
          </td>
          <td>
            <div>${pagoMovilTexto}</div>
          </td>
          <td>
            <button class="btn-map" onclick='openMapModal(${JSON.stringify(m)})'>
              ${hasCoords ? '📍 Editar Coordenadas' : '➕ Asignar Mapa'}
            </button>
          </td>
          <td>
            <select onchange="updateLevel('${m.id}', this.value)">
              <option value="1" ${m.nivel_verificacion == 1 ? 'selected' : ''}>1★ Básico</option>
              <option value="2" ${m.nivel_verificacion == 2 ? 'selected' : ''}>2★ Comercial</option>
              <option value="3" ${m.nivel_verificacion == 3 ? 'selected' : ''}>3★ Gold</option>
            </select>
          </td>
          <td>
            <a href="/verify?id=${slug}" style="color: var(--accent); font-size: 12px;" target="_blank">Ver Certificado</a>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openMapModal(merchant) {
      activeMerchant = merchant;
      document.getElementById('modalTitle').textContent = `📍 Ubicar: ${merchant.tienda}`;
      document.getElementById('mapModal').style.display = 'flex';

      const lat = merchant.latitud ? parseFloat(merchant.latitud) : MATURIN_LAT;
      const lng = merchant.longitud ? parseFloat(merchant.longitud) : MATURIN_LNG;

      document.getElementById('latInput').value = lat.toFixed(6);
      document.getElementById('lngInput').value = lng.toFixed(6);

      setTimeout(() => {
        if (!map) {
          map = L.map('map').setView([lat, lng], 14);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
          }).addTo(map);

          marker = L.marker([lat, lng], { draggable: true }).addTo(map);

          marker.on('dragend', function () {
            const pos = marker.getLatLng();
            document.getElementById('latInput').value = pos.lat.toFixed(6);
            document.getElementById('lngInput').value = pos.lng.toFixed(6);
          });

          map.on('click', function (e) {
            marker.setLatLng(e.latlng);
            document.getElementById('latInput').value = e.latlng.lat.toFixed(6);
            document.getElementById('lngInput').value = e.latlng.lng.toFixed(6);
          });
        } else {
          map.setView([lat, lng], 14);
          marker.setLatLng([lat, lng]);
          map.invalidateSize();
        }
      }, 200);
    }

    function closeModal() {
      document.getElementById('mapModal').style.display = 'none';
    }

    async function saveLocation() {
      if (!activeMerchant) return;

      const lat = document.getElementById('latInput').value;
      const lng = document.getElementById('lngInput').value;

      try {
        const res = await fetch(`/api/merchants/${activeMerchant.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ latitud: lat, longitud: lng })
        });

        const data = await res.json();
        if (data.success) {
          alert('✅ Coordenadas guardadas correctamente');
          closeModal();
          loadMerchants();
        } else {
          alert('❌ Error al guardar: ' + (data.message || 'Error desconocido'));
        }
      } catch (err) {
        alert('❌ Error de conexión con el servidor');
      }
    }

    async function updateLevel(id, nivel) {
      try {
        await fetch(`/api/merchants/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nivel_verificacion: nivel })
        });
      } catch (err) {
        console.error('Error actualizando nivel:', err);
      }
    }
  </script>
</body>
</html>
