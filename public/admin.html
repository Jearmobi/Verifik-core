<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Verifik Shield</title>
  
  <!-- CSS Leaflet Mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    h1 { color: var(--accent); font-size: 24px; }

    .admin-grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }

    .list-card, .detail-card {
      background-color: var(--card);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .merchant-item {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .merchant-item:hover, .merchant-item.active {
      background-color: #334155;
      border-color: var(--accent);
    }

    .merchant-item h4 { color: var(--accent); font-size: 15px; }
    .merchant-item p { font-size: 12px; color: #94a3b8; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: #fff; }

    #map { height: 300px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); }

    .btn-save {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      font-size: 15px;
    }

    .btn-save:hover { background-color: #0284c7; }
    
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-active { background-color: #166534; color: #4ade80; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🛡️ Admin Panel - Ubicación y Certificación</h1>
    <span>Maturín, Venezuela</span>
  </div>

  <div class="admin-grid">
    <!-- Lista de Comercios -->
    <div class="list-card">
      <h3>Comercios Registrados</h3>
      <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">Selecciona un comercio para ajustar su mapa:</p>
      <div id="merchants-list">Cargando comercios...</div>
    </div>

    <!-- Detalle y Geolocalización en Mapa -->
    <div class="detail-card">
      <h3 id="selected-title">Selecciona un comercio</h3>
      
      <form id="geo-form" style="display: none; margin-top: 15px;">
        <input type="hidden" id="merchant-id" />

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label>Nivel de Verificación</label>
            <select id="nivel_verificacion">
              <option value="1">Nivel 1 - Básico (Registro Web)</option>
              <option value="2">Nivel 2 - Verificado (Ubicación Validada)</option>
              <option value="3">Nivel 3 - Gold (Comercio Destacado)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Estado del Comercio</label>
            <select id="estado">
              <option value="activo">Activo</option>
              <option value="suspendido">Suspendido</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Dirección Descriptiva</label>
          <input type="text" id="direccion" placeholder="Ej. Sector Tipuro, C.C. Servimas, Local 4" />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label>Latitud</label>
            <input type="text" id="latitud" readonly />
          </div>
          <div class="form-group">
            <label>Longitud</label>
            <input type="text" id="longitud" readonly />
          </div>
        </div>

        <label>📍 Haz clic en el mapa de Maturín o arrastra el pin para ubicar el comercio:</label>
        <div id="map"></div>

        <button type="submit" class="btn-save">💾 Guardar Ubicación y Verificación</button>
      </form>
    </div>
  </div>

  <!-- JS Leaflet Mapa -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, marker;
    let selectedMerchant = null;

    // Coordenadas iniciales por defecto: Maturín, Venezuela
    const MATURIN_LAT = 9.7457;
    const MATURIN_LNG = -63.1832;

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      loadMerchants();
    });

    function initMap() {
      map = L.map('map').setView([MATURIN_LAT, MATURIN_LNG], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Crear pin arrastrable
      marker = L.marker([MATURIN_LAT, MATURIN_LNG], { draggable: true }).addTo(map);

      // Evento al arrastrar el pin
      marker.on('dragend', function (e) {
        const position = marker.getLatLng();
        document.getElementById('latitud').value = position.lat.toFixed(6);
        document.getElementById('longitud').value = position.lng.toFixed(6);
      });

      // Evento al hacer clic directo en el mapa
      map.on('click', function (e) {
        marker.setLatLng(e.latlng);
        document.getElementById('latitud').value = e.latlng.lat.toFixed(6);
        document.getElementById('longitud').value = e.latlng.lng.toFixed(6);
      });
    }

    async function loadMerchants() {
      try {
        const res = await fetch('/api/merchants');
        const result = await res.json();

        if (result.success) {
          renderList(result.data);
        }
      } catch (err) {
        console.error('Error cargando comercios:', err);
      }
    }

    function renderList(merchants) {
      const container = document.getElementById('merchants-list');
      container.innerHTML = '';

      merchants.forEach(m => {
        const div = document.createElement('div');
        div.className = 'merchant-item';
        div.innerHTML = `
          <h4>${m.tienda || 'Sin Nombre'} <span class="status-badge badge-active">${m.estado || 'activo'}</span></h4>
          <p>RIF: ${m.rif || 'N/A'} | Tel: ${m.telefono || 'N/A'}</p>
          <p>📍 ${m.latitud ? 'Ubicación asignada' : '⚠️ Sin coordenadas'}</p>
        `;
        div.onclick = () => selectMerchant(m, div);
        container.appendChild(div);
      });
    }

    function selectMerchant(m, element) {
      document.querySelectorAll('.merchant-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');

      selectedMerchant = m;
      document.getElementById('selected-title').textContent = `Geolocalizar: ${m.tienda}`;
      document.getElementById('geo-form').style.display = 'block';

      document.getElementById('merchant-id').value = m.id;
      document.getElementById('nivel_verificacion').value = m.nivel_verificacion || 1;
      document.getElementById('estado').value = m.estado || 'activo';
      document.getElementById('direccion').value = m.direccion || '';

      const lat = m.latitud ? parseFloat(m.latitud) : MATURIN_LAT;
      const lng = m.longitud ? parseFloat(m.longitud) : MATURIN_LNG;

      document.getElementById('latitud').value = lat;
      document.getElementById('longitud').value = lng;

      // Centrar mapa y mover pin
      const newLatLng = new L.LatLng(lat, lng);
      map.setView(newLatLng, 15);
      marker.setLatLng(newLatLng);

      setTimeout(() => map.invalidateSize(), 300); // Forzar renderizado de mapa
    }

    // Guardar cambios
    document.getElementById('geo-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('merchant-id').value;

      const payload = {
        latitud: document.getElementById('latitud').value,
        longitud: document.getElementById('longitud').value,
        nivel_verificacion: document.getElementById('nivel_verificacion').value,
        estado: document.getElementById('estado').value,
        direccion: document.getElementById('direccion').value
      };

      try {
        const res = await fetch(`/api/merchants/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
          alert('✅ Ubicación y datos actualizados con éxito en Supabase');
          loadMerchants();
        } else {
          alert('❌ Error: ' + data.message);
        }
      } catch (err) {
        alert('❌ Error al guardar datos');
      }
    });
  </script>
</body>
</html>
