<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría & Gestión - Verifik Shield</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 30px; }

    .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .badge-pill { background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    h1 { font-size: 22px; margin-top: 5px; }

    .table-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #1f2937; color: var(--text-muted); padding: 14px 16px; font-size: 11px; text-transform: uppercase; }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border); }

    .btn-map { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid var(--accent); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
    .btn-map:hover { background: var(--accent); color: #000; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 600px; padding: 20px; }
    #map { height: 320px; border-radius: 8px; margin: 15px 0; border: 1px solid var(--border); }
    
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-cancel { background: #374151; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    .btn-save { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header-container">
    <div>
      <span class="badge-pill">PANEL DE CONTROL</span>
      <h1>Auditoría & Gestión Verifik Shield</h1>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Comercio</th>
          <th>RIF / Propietario</th>
          <th>Pago Móvil</th>
          <th>Ubicación</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="merchants-table">
        <tr><td colspan="5" style="text-align:center;">Cargando comercios...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Modal Mapa -->
  <div class="modal-overlay" id="mapModal">
    <div class="modal-card">
      <h3 id="modalTitle">📍 Ubicar Comercio en Mapa</h3>
      <div id="map"></div>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
        <div>
          <label style="font-size: 11px; color: var(--text-muted);">Latitud</label>
          <input type="text" id="latInput" readonly style="width: 100%; padding: 6px; background: #1f2937; color: #fff; border: 1px solid var(--border); border-radius: 4px;" />
        </div>
        <div>
          <label style="font-size: 11px; color: var(--text-muted);">Longitud</label>
          <input type="text" id="lngInput" readonly style="width: 100%; padding: 6px; background: #1f2937; color: #fff; border: 1px solid var(--border); border-radius: 4px;" />
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-save" onclick="saveLocation()">Guardar Coordenadas</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map = null;
    let marker = null;
    let activeMerchantId = null;

    // Centro inicial: Maturín, Monagas
    const MATURIN_LAT = 9.7457;
    const MATURIN_LNG = -63.1832;

    document.addEventListener('DOMContentLoaded', loadMerchants);

    async function loadMerchants() {
      try {
        const res = await fetch('/api/merchants');
        const result = await res.json();
        if (result.success) renderTable(result.data);
      } catch (err) {
        console.error('Error al cargar datos:', err);
      }
    }

    function renderTable(merchants) {
      const tbody = document.getElementById('merchants-table');
      tbody.innerHTML = '';

      merchants.forEach(m => {
        const tr = document.createElement('tr');
        const hasCoords = m.latitud && m.longitud;

        tr.innerHTML = `
          <td><strong>${m.tienda || 'Sin Nombre'}</strong></td>
          <td>${m.rif || 'Sin RIF'} <br><small style="color:var(--text-muted);">${m.propietario || ''}</small></td>
          <td>${m.banco_pago || 'N/A'} - ${m.cedula_pago || ''}</td>
          <td>
            <button class="btn-map" onclick="openMapModal('${m.id}', '${m.tienda}', ${m.latitud}, ${m.longitud})">
              ${hasCoords ? '📍 Editar Coordenadas' : '➕ Configurar Mapa'}
            </button>
          </td>
          <td><a href="/verify?id=${m.tienda}" target="_blank" style="color:var(--accent);">Ver Certificado</a></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openMapModal(id, tienda, lat, lng) {
      activeMerchantId = id;
      document.getElementById('modalTitle').textContent = `📍 Ubicar: ${tienda}`;
      document.getElementById('mapModal').style.display = 'flex';

      const initialLat = lat ? parseFloat(lat) : MATURIN_LAT;
      const initialLng = lng ? parseFloat(lng) : MATURIN_LNG;

      document.getElementById('latInput').value = initialLat.toFixed(6);
      document.getElementById('lngInput').value = initialLng.toFixed(6);

      // Esperar a que la ventana modal sea visible para renderizar el mapa correctamente
      setTimeout(() => {
        if (!map) {
          map = L.map('map').setView([initialLat, initialLng], 14);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
          }).addTo(map);

          marker = L.marker([initialLat, initialLng], { draggable: true }).addTo(map);

          marker.on('dragend', function () {
            const pos = marker.getLatLng();
            document.getElementById('latInput').value = pos.lat.toFixed(6);
            document.getElementById('lngInput').value = pos.lng.toFixed(6);
          });

          map.on('click', function (e) {
            marker.setLatLng(e.latlng);
            document.getElementById('latInput').value = e.latlng.lat.toFixed(6);
            document.getElementById('lngInput').value = e.latlng.lng.toFixed(6);
          });
        } else {
          map.setView([initialLat, initialLng], 14);
          marker.setLatLng([initialLat, initialLng]);
          map.invalidateSize();
        }
      }, 200);
    }

    function closeModal() {
      document.getElementById('mapModal').style.display = 'none';
    }

    async function saveLocation() {
      if (!activeMerchantId) return;

      const lat = document.getElementById('latInput').value;
      const lng = document.getElementById('lngInput').value;

      try {
        const res = await fetch(`/api/merchants/${activeMerchantId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ latitud: lat, longitud: lng })
        });

        const data = await res.json();
        if (data.success) {
          alert('✅ Coordenadas guardadas en Supabase');
          closeModal();
          loadMerchants();
        } else {
          alert('❌ Error: ' + data.message);
        }
      } catch (err) {
        alert('❌ Error al conectar con el servidor');
      }
    }
  </script>
</body>
</html>
