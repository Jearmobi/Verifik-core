<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verikik Shield - Confirmación de Autenticidad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-sm border border-slate-700 text-center">
    
    <div id="status-card" class="p-4 rounded-xl bg-slate-900 border border-slate-700 mb-4">
      <div id="status-icon" class="text-4xl mb-2">⏳</div>
      <h2 id="status-title" class="text-lg font-bold">Verificando...</h2>
      <p id="status-msg" class="text-xs text-slate-400 mt-1">Conectando con el servidor...</p>
    </div>

    <!-- Panel de Datos de la Tienda -->
    <div id="merchant-info" class="hidden text-left bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 mb-4 space-y-2 text-xs">
      <div>
        <span class="text-slate-400">Comercio:</span>
        <p id="merchant-name" class="font-bold text-white text-sm">---</p>
      </div>
      <div>
        <span class="text-slate-400">Propietario:</span>
        <p id="merchant-owner" class="font-semibold text-slate-200">---</p>
      </div>
      <div>
        <span class="text-slate-400">Dirección:</span>
        <p id="merchant-address" class="font-semibold text-slate-200">---</p>
      </div>
    </div>

    <!-- Sección de Auditoría Comunitaria -->
    <div id="vote-section" class="hidden border-t border-slate-700 pt-4 mt-2">
      <p class="text-xs text-slate-400 mb-3">¿Realizaste un pago o compra en este comercio?</p>
      <button 
        id="btn-vote" 
        onclick="votarComercio()"
        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center space-x-2"
      >
        <span>👍</span>
        <span>Confirmar Compra Segura</span>
      </button>
      <p id="vote-feedback" class="text-xs text-emerald-400 font-semibold mt-2 hidden"></p>
    </div>

  </div>

  <script>
    let tiendaIdActual = '';

    async function validarToken() {
      const pathParts = window.location.pathname.split('/');
      tiendaIdActual = pathParts[pathParts.length - 1];
      
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        mostrarEstado('❌', 'Token no recibido', 'Escanear el código QR directamente desde la pantalla del comercio.', 'border-red-500/30 bg-red-500/10');
        return;
      }

      try {
        const respuesta = await fetch(`/api/verify/${tiendaIdActual}?token=${token}`);
        const datos = await respuesta.json();

        if (datos.valido) {
          mostrarEstado('🛡️', '¡Comercio 100% Auténtico!', datos.mensaje, 'border-emerald-500/30 bg-emerald-500/10');
          
          document.getElementById('merchant-info').classList.remove('hidden');
          document.getElementById('merchant-name').innerText = datos.tienda || 'Comercio Registrado';
          document.getElementById('merchant-owner').innerText = datos.propietario || 'Propietario Verificado';
          document.getElementById('merchant-address').innerText = datos.direccion || 'Ubicación Registrada';
          
          document.getElementById('vote-section').classList.remove('hidden');
        } else {
          mostrarEstado('⚠️', 'Verificación Fallida', datos.mensaje, 'border-red-500/30 bg-red-500/10');
        }
      } catch (e) {
        mostrarEstado('❌', 'Error de Conexión', 'No se pudo validar el código con el servidor.', 'border-red-500/30 bg-red-500/10');
      }
    }

    function mostrarEstado(icono, titulo, msg, clases) {
      document.getElementById('status-icon').innerText = icono;
      document.getElementById('status-title').innerText = titulo;
      document.getElementById('status-msg').innerText = msg;
      document.getElementById('status-card').className = `p-4 rounded-xl border mb-4 ${clases}`;
    }

    async function votarComercio() {
      const btn = document.getElementById('btn-vote');
      const feedback = document.getElementById('vote-feedback');
      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');

      try {
        const respuesta = await fetch(`/api/merchants/${tiendaIdActual}/vote`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const datos = await respuesta.json();

        if (datos.exito) {
          btn.classList.add('hidden');
          feedback.innerText = "✓ Voto registrado. ¡Gracias por contribuir a la comunidad!";
          feedback.classList.remove('hidden');
        }
      } catch (e) {
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
        alert('Error al registrar el voto. Intenta nuevamente.');
      }
    }

    validarToken();
  </script>
</body>
</html>
