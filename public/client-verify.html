<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifik Shield - Confirmación de Autenticidad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-sm bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 text-center">
    
    <!-- Encabezado -->
    <div class="flex justify-center items-center gap-2 mb-4">
      <h1 class="text-xs font-bold tracking-widest text-slate-400 uppercase">Verifik Shield • Auditoría</h1>
    </div>

    <!-- Carga inicial -->
    <div id="loading" class="py-8">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-emerald-500 mb-2"></div>
      <p class="text-sm text-slate-400">Verificando firma digital del comercio...</p>
    </div>

    <!-- Tarjeta de Resultado -->
    <div id="result-card" class="hidden">
      <!-- Icono de Resultado -->
      <div id="status-icon" class="w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 text-3xl"></div>

      <h2 id="status-title" class="text-xl font-extrabold mb-1"></h2>
      <p id="merchant-name" class="text-sm font-semibold text-slate-300"></p>
      <p id="merchant-rif" class="text-xs text-slate-400 mb-4"></p>

      <div id="status-message-box" class="p-3 rounded-xl border mb-4 text-xs font-medium">
        <p id="status-message"></p>
      </div>

      <a href="/verify/demo-tienda" class="inline-block w-full py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-bold transition">
        Volver a la pantalla principal
      </a>
    </div>

  </div>

  <script>
    async function validarEscaneo() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      const loadingEl = document.getElementById('loading');
      const resultCardEl = document.getElementById('result-card');
      const statusIconEl = document.getElementById('status-icon');
      const statusTitleEl = document.getElementById('status-title');
      const merchantNameEl = document.getElementById('merchant-name');
      const merchantRifEl = document.getElementById('merchant-rif');
      const statusMsgBoxEl = document.getElementById('status-message-box');
      const statusMsgEl = document.getElementById('status-message');

      // ID fijo de prueba si no viene definido
      const tiendaId = 'demo-tienda';

      if (!token) {
        loadingEl.classList.add('hidden');
        resultCardEl.classList.remove('hidden');
        statusIconEl.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 text-3xl bg-amber-500/20 text-amber-400 border border-amber-500/30";
        statusIconEl.innerText = "⚠️";
        statusTitleEl.innerText = "SIN TOKEN";
        statusTitleEl.className = "text-xl font-extrabold text-amber-400 mb-1";
        statusMsgEl.innerText = "No se proporcionó un token de validación.";
        return;
      }

      try {
        const res = await fetch(`/api/verify/${tiendaId}?token=${token}`);
        const data = await res.json();

        loadingEl.classList.add('hidden');
        resultCardEl.classList.remove('hidden');

        if (data.valido) {
          statusIconEl.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 text-3xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
          statusIconEl.innerText = "✓";
          statusTitleEl.innerText = "¡COMERCIO VERIFICADO!";
          statusTitleEl.className = "text-xl font-extrabold text-emerald-400 mb-1";
          merchantNameEl.innerText = data.tienda;
          merchantRifEl.innerText = `RIF: ${data.rif}`;
          statusMsgBoxEl.className = "p-3 rounded-xl border border-emerald-500/30 bg-emerald-500/10 mb-4 text-xs font-medium text-emerald-300";
          statusMsgEl.innerText = data.mensaje;
        } else {
          statusIconEl.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 text-3xl bg-rose-500/20 text-rose-400 border border-rose-500/30";
          statusIconEl.innerText = "✕";
          statusTitleEl.innerText = "CÓDIGO NO VÁLIDO";
          statusTitleEl.className = "text-xl font-extrabold text-rose-400 mb-1";
          merchantNameEl.innerText = data.tienda || "Comercio no verificado";
          statusMsgBoxEl.className = "p-3 rounded-xl border border-rose-500/30 bg-rose-500/10 mb-4 text-xs font-medium text-rose-300";
          statusMsgEl.innerText = data.mensaje;
        }

      } catch (err) {
        console.error('Error al verificar:', err);
        loadingEl.classList.add('hidden');
        resultCardEl.classList.remove('hidden');
        statusIconEl.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 text-3xl bg-rose-500/20 text-rose-400 border border-rose-500/30";
        statusIconEl.innerText = "✕";
        statusTitleEl.innerText = "ERROR DE CONEXIÓN";
        statusMsgEl.innerText = "No se pudo conectar con el servidor de auditoría.";
      }
    }

    validarEscaneo();
  </script>
</body>
</html>
