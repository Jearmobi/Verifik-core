<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifik Shield - Registrar Comercio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-lg border border-slate-700 my-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-400">Verifik Shield</h1>
      <p class="text-slate-400 text-sm mt-1">Alta de Comercio & Perfil de Autenticidad</p>
    </div>

    <form id="register-form" class="space-y-4">
      <!-- Datos Principales -->
      <div>
        <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Nombre del Comercio</label>
        <input type="text" id="nombre" placeholder="Ej. Farmacia San José" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Identificador (Slug)</label>
          <input type="text" id="slug" placeholder="farmacia-san-jose" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">RIF del Comercio</label>
          <input type="text" id="rif" placeholder="J-987654321" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition" />
        </div>
      </div>

      <!-- Datos del Propietario / Contacto -->
      <div class="border-t border-slate-700 pt-3">
        <p class="text-xs text-blue-400 font-bold uppercase mb-3">Información del Propietario & Ubicación</p>
        
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Propietario / Responsable</label>
            <input type="text" id="propietario" placeholder="Ej. Carlos Mendoza" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Teléfono de Contacto</label>
            <input type="text" id="telefono" placeholder="+58 414-1234567" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition" />
          </div>
        </div>

        <div class="mb-3">
          <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Dirección Física</label>
          <input type="text" id="direccion" placeholder="Ej. Av. Alirio Ugarte Pelayo, Maturín" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Categoría</label>
            <select id="categoria" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition">
              <option value="Farmacia / Salud">Farmacia / Salud</option>
              <option value="Repuestos Automotrices">Repuestos Automotrices</option>
              <option value="Supermercado / Alimentos">Supermercado / Alimentos</option>
              <option value="Tecnología / Servicios">Tecnología / Servicios</option>
              <option value="Comercio General">Comercio General</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Color de Marca</label>
            <input type="color" id="colorMarca" value="#2563eb" class="w-full bg-slate-900 border border-slate-700 rounded-lg h-12 p-1 cursor-pointer" />
          </div>
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200 mt-4">
        Registrar Comercio Completo
      </button>
    </form>

    <div id="result" class="hidden mt-6 p-4 rounded-lg bg-slate-900 border border-slate-700 text-sm">
      <p id="result-message" class="font-semibold text-green-400 mb-2"></p>
      <p class="text-xs text-slate-400">Enlace del punto de venta:</p>
      <a id="result-link" href="#" target="_blank" class="text-blue-400 underline text-xs break-all"></a>
    </div>
  </div>

  <script>
    document.getElementById('nombre').addEventListener('input', (e) => {
      document.getElementById('slug').value = e.target.value
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9-]/g, '-')
        .replace(/-+/g, '-');
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        nombre: document.getElementById('nombre').value,
        slug: document.getElementById('slug').value,
        rif: document.getElementById('rif').value,
        propietario: document.getElementById('propietario').value,
        telefono: document.getElementById('telefono').value,
        direccion: document.getElementById('direccion').value,
        categoria: document.getElementById('categoria').value,
        colorMarca: document.getElementById('colorMarca').value
      };

      try {
        const response = await fetch('/api/merchants/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        const resultDiv = document.getElementById('result');
        const resultMsg = document.getElementById('result-message');
        const resultLink = document.getElementById('result-link');

        resultDiv.classList.remove('hidden');

        if (response.ok && data.exito) {
          resultMsg.className = "font-semibold text-green-400 mb-2";
          resultMsg.innerText = "¡Comercio registrado con éxito!";
          resultLink.href = data.comercio.urlPantalla;
          resultLink.innerText = data.comercio.urlPantalla;
          document.getElementById('register-form').reset();
        } else {
          resultMsg.className = "font-semibold text-red-400 mb-2";
          resultMsg.innerText = data.error || "Error al registrar.";
          resultLink.innerText = "";
        }
      } catch (err) {
        console.error('Error al conectar:', err);
      }
    });
  </script>
</body>
</html>
