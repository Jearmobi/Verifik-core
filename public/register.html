<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifik Shield - Registro de Comercio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-3 font-sans">

  <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
    <div class="text-center space-y-1">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 text-sky-400 text-xs font-semibold uppercase tracking-wider border border-sky-500/20">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        VERIFIK SHIELD
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">Registro de Comercio Seguro</h1>
      <p class="text-xs text-slate-400">Completa los datos para dar de alta tu certificado digital anti-fraude</p>
    </div>

    <form id="registerForm" class="space-y-4">
      
      <!-- Seccion 1: Identificación Comercial -->
      <div class="border-b border-slate-800 pb-4 space-y-3">
        <h2 class="text-xs font-bold text-sky-400 uppercase tracking-wider">1. Identificación Comercial</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Identificador Único (Slug / ID) *</label>
            <input type="text" id="slug" required placeholder="ej: farmacia-central" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-sky-500">
            <span class="text-[10px] text-slate-500 mt-0.5 block">Será tu URL: verify?id=tu-id</span>
          </div>

          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Nombre Comercial de la Tienda *</label>
            <input type="text" id="tienda" required placeholder="Ej: Farmacia Central Maturín" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-sky-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">RIF de la Empresa / Firma *</label>
            <input type="text" id="rif" required placeholder="J-50123456-7" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-sky-500">
          </div>

          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Propietario o Rep. Legal *</label>
            <input type="text" id="propietario" required placeholder="Nombre y Apellido" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-sky-500">
          </div>
        </div>
      </div>

      <!-- Seccion 2: Contacto y Redes -->
      <div class="border-b border-slate-800 pb-4 space-y-3">
        <h2 class="text-xs font-bold text-sky-400 uppercase tracking-wider">2. Contacto y Redes Oficiales</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Teléfono WhatsApp Oficial *</label>
            <input type="text" id="telefono" required placeholder="+584141234567" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-sky-500">
          </div>

          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Usuario de Instagram (@)</label>
            <input type="text" id="instagram" placeholder="farmaciacentral" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-sky-500">
          </div>
        </div>

        <div>
          <label class="block text-[11px] text-slate-400 mb-1">Dirección / Ubicación Física *</label>
          <input type="text" id="direccion" required placeholder="Av. Bolívar, Maturín, Monagas" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-sky-500">
        </div>
      </div>

      <!-- Seccion 3: Datos de Pago Móvil Autorizados -->
      <div class="border-b border-slate-800 pb-4 space-y-3">
        <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">3. Datos de Pago Móvil Autorizados</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Banco</label>
            <input type="text" id="banco_pago_movil" placeholder="Ej: Banesco / Mercantil" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
          </div>

          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Cédula / RIF</label>
            <input type="text" id="cedula_pago_movil" placeholder="J-501234567" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
          </div>

          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Teléfono Pago Móvil</label>
            <input type="text" id="telefono_pago_movil" placeholder="04141234567" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500">
          </div>
        </div>
      </div>

      <!-- Seccion 4: Personalización de Marca -->
      <div>
        <label class="block text-[11px] text-slate-400 mb-1">Color Identificador de Marca</label>
        <div class="flex items-center gap-2">
          <input type="color" id="colorMarca" value="#0284c7" class="w-9 h-9 rounded-lg bg-transparent cursor-pointer border-0">
          <span id="colorHex" class="text-xs font-mono text-slate-400">#0284c7</span>
        </div>
      </div>

      <!-- Mensaje de estado -->
      <div id="statusMessage" class="hidden text-center text-xs p-3 rounded-xl"></div>

      <!-- Botón de envio -->
      <button type="submit" id="submitBtn" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-3 px-4 rounded-xl text-xs transition duration-200 shadow-lg shadow-sky-600/20">
        Registrar Comercio en Verifik Shield
      </button>

    </form>
  </div>

  <script>
    const colorInput = document.getElementById('colorMarca');
    const colorHex = document.getElementById('colorHex');
    
    colorInput.addEventListener('input', (e) => {
      colorHex.textContent = e.target.value;
    });

    const form = document.getElementById('registerForm');
    const statusMsg = document.getElementById('statusMessage');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando comercio...';
      statusMsg.className = 'hidden';

      const payload = {
        id: document.getElementById('slug').value,
        tienda: document.getElementById('tienda').value,
        rif: document.getElementById('rif').value,
        propietario: document.getElementById('propietario').value,
        telefono: document.getElementById('telefono').value,
        instagram: document.getElementById('instagram').value,
        direccion: document.getElementById('direccion').value,
        banco_pago_movil: document.getElementById('banco_pago_movil').value,
        cedula_pago_movil: document.getElementById('cedula_pago_movil').value,
        telefono_pago_movil: document.getElementById('telefono_pago_movil').value,
        colorMarca: document.getElementById('colorMarca').value
      };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          statusMsg.className = 'text-center text-xs p-3 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 block';
          statusMsg.innerHTML = `¡Comercio registrado con éxito! <br><a href="/verify?id=${payload.id}" target="_blank" class="underline font-bold">Ver Certificado</a>`;
          form.reset();
        } else {
          throw new Error(data.error || 'Error al guardar el comercio');
        }
      } catch (err) {
        statusMsg.className = 'text-center text-xs p-3 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/20 block';
        statusMsg.textContent = `Error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Registrar Comercio en Verifik Shield';
      }
    });
  </script>
</body>
</html>
