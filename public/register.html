<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifik Shield - Registrar Comercio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-400">Verifik Shield</h1>
      <p class="text-xs text-slate-400">Alta de Comercio & Perfil de Autenticidad</p>
    </div>

    <form id="registerForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Nombre del Comercio</label>
        <input type="text" name="tienda" required placeholder="Ej. Farmacia La Fe" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Identificador (Slug)</label>
          <input type="text" name="id" placeholder="ej-farmacia-la-fe" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">RIF del Comercio</label>
          <input type="text" name="rif" required placeholder="J-12345678-0" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Propietario / Responsable</label>
          <input type="text" name="propietario" placeholder="Nombre completo" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Teléfono de Contacto</label>
          <input type="text" name="telefono" placeholder="+58 412 000 0000" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Dirección Física</label>
        <input type="text" name="direccion" placeholder="Av. Principal, Maturín, Monagas" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Categoría</label>
          <select name="categoria" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <option value="Farmacia / Salud">Farmacia / Salud</option>
            <option value="Supermercado">Supermercado</option>
            <option value="Repuestos">Repuestos</option>
            <option value="Servicios">Servicios</option>
            <option value="General">General</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Color de Marca</label>
          <input type="color" name="colorMarca" value="#2563eb" class="w-full bg-slate-900 border border-slate-700 rounded h-9 p-1 cursor-pointer">
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition duration-200">
        Registrar Comercio Completo
      </button>
    </form>

    <div id="resultado" class="mt-4 hidden p-3 rounded bg-slate-900 border border-slate-700 text-xs"></div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resDiv = document.getElementById('resultado');
      resDiv.innerText = 'Procesando registro...';
      resDiv.className = 'mt-4 p-3 rounded bg-blue-900/50 border border-blue-500 text-blue-200 text-xs block';

      const formData = new FormData(e.target);
      const bodyData = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        const data = await res.json();

        if (data.exito) {
          resDiv.innerHTML = `<strong>¡Comercio registrado con éxito!</strong><br>ID: ${data.tiendaId}<br><a href="/verify" class="underline text-green-300 font-bold mt-1 inline-block">Ir a Verificación</a>`;
          resDiv.className = 'mt-4 p-3 rounded bg-green-900/50 border border-green-500 text-green-200 text-xs block';
        } else {
          resDiv.innerText = 'Error: ' + data.mensaje;
          resDiv.className = 'mt-4 p-3 rounded bg-red-900/50 border border-red-500 text-red-200 text-xs block';
        }
      } catch (err) {
        resDiv.innerText = 'Error de conexión con el servidor: ' + err.message;
        resDiv.className = 'mt-4 p-3 rounded bg-red-900/50 border border-red-500 text-red-200 text-xs block';
      }
    });
  </script>
</body>
</html>
