<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifik Shield - Registrar Comercio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-2xl">
    <h1 class="text-2xl font-bold text-center text-blue-400 mb-1">Verifik Shield</h1>
    <p class="text-xs text-slate-400 text-center mb-6">Alta de Comercio & Perfil de Autenticidad</p>

    <form id="registerForm" class="space-y-4">
      <div>
        <label class="block text-xs text-slate-400 mb-1">NOMBRE DEL COMERCIO</label>
        <input type="text" id="tienda" required placeholder="Ej: TIENDITA" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-blue-500 outline-none">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-slate-400 mb-1">IDENTIFICADOR (SLUG)</label>
          <input type="text" id="id" required placeholder="tiendita" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">RIF DEL COMERCIO</label>
          <input type="text" id="rif" required placeholder="J-31293800-0" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-blue-500 outline-none">
        </div>
      </div>

      <hr class="border-slate-700 my-2">

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-slate-400 mb-1">PROPIETARIO / RESPONSABLE</label>
          <input type="text" id="propietario" placeholder="Luisana Hernández" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">TELÉFONO DE CONTACTO</label>
          <input type="text" id="telefono" placeholder="+584000000" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-blue-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">DIRECCIÓN FÍSICA</label>
        <input type="text" id="direccion" placeholder="CARIPITO" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-blue-500 outline-none">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-slate-400 mb-1">CATEGORÍA</label>
          <select id="categoria" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:border-blue-500 outline-none">
            <option value="Farmacia / Salud">Farmacia / Salud</option>
            <option value="Supermercado">Supermercado</option>
            <option value="Tecnología">Tecnología</option>
            <option value="Ropa / Moda">Ropa / Moda</option>
            <option value="General">General</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">COLOR DE MARCA</label>
          <input type="color" id="colorMarca" value="#2563eb" class="w-full h-9 bg-slate-900 border border-slate-700 rounded cursor-pointer">
        </div>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2 px-4 rounded text-sm transition mt-4">
        Registrar Comercio Completo
      </button>
    </form>

    <div id="resultado" class="mt-4 hidden p-3 rounded bg-slate-900 border border-slate-700 text-xs"></div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resDiv = document.getElementById('resultado');
      resDiv.classList.remove('hidden');
      resDiv.innerText = 'Guardando...';

      const payload = {
        id: document.getElementById('id').value.trim(),
        tienda: document.getElementById('tienda').value.trim(),
        rif: document.getElementById('rif').value.trim(),
        propietario: document.getElementById('propietario').value.trim(),
        telefono: document.getElementById('telefono').value.trim(),
        direccion: document.getElementById('direccion').value.trim(),
        categoria: document.getElementById('categoria').value,
        colorMarca: document.getElementById('colorMarca').value
      };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.exito) {
          resDiv.className = 'mt-4 p-3 rounded bg-green-900/50 border border-green-500 text-green-200 text-xs';
          resDiv.innerHTML = `<strong>¡Registrado con éxito!</strong><br>ID: ${data.tiendaId}<br><a href="/verify/${data.tiendaId}" class="underline text-blue-300" target="_blank">Ir a pantalla de verificación ➔</a>`;
        } else {
          resDiv.className = 'mt-4 p-3 rounded bg-red-900/50 border border-red-500 text-red-200 text-xs';
          resDiv.innerText = 'Error: ' + data.mensaje;
        }
      } catch (err) {
        resDiv.className = 'mt-4 p-3 rounded bg-red-900/50 border border-red-500 text-red-200 text-xs';
        resDiv.innerText = 'Error de conexión con el servidor.';
      }
    });
  </script>
</body>
</html>
