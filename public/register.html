<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Comercio - Verifik Shield</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --input-bg: #334155;
      --border-color: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 480px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: #cbd5e1;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    .section-title {
      font-size: 14px;
      color: var(--accent-color);
      margin: 18px 0 10px 0;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .success {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .error {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Certificar Comercio</h2>
    
    <form id="registerForm">
      <div class="form-group">
        <label for="tienda">Nombre de la Tienda / Comercio *</label>
        <input type="text" id="tienda" required placeholder="Ej. Bodega Jesús">
      </div>

      <div class="form-group">
        <label for="rif">RIF o Cédula *</label>
        <input type="text" id="rif" required placeholder="Ej. J-296424999">
      </div>

      <div class="form-group">
        <label for="propietario">Nombre del Propietario</label>
        <input type="text" id="propietario" placeholder="Ej. Jesús Moya">
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono de Contacto (WhatsApp) *</label>
        <input type="text" id="telefono" required placeholder="+584128425733">
      </div>

      <div class="form-group">
        <label for="direccion">Dirección en Maturín</label>
        <input type="text" id="direccion" placeholder="Ej. Las Vírgenes, Tipuro, Centro">
      </div>

      <div class="form-group">
        <label for="categoria">Categoría</label>
        <select id="categoria">
          <option value="General">General / Víveres</option>
          <option value="Repuestos">Repuestos Automotrices</option>
          <option value="Tecnología">Tecnología y Celulares</option>
          <option value="Gastronomía">Gastronomía y Comida</option>
        </select>
      </div>

      <div class="form-group">
        <label for="instagram">Usuario de Instagram (Opcional)</label>
        <input type="text" id="instagram" placeholder="Ej. tu_comercio">
      </div>

      <div class="section-title">💳 Datos de Pago Móvil Oficial</div>

      <div class="form-group">
        <label for="banco_pago">Banco</label>
        <input type="text" id="banco_pago" placeholder="Ej. Banesco / Mercantil">
      </div>

      <div class="form-group">
        <label for="cedula_pago">Cédula / RIF de la Cuenta</label>
        <input type="text" id="cedula_pago" placeholder="Ej. 29642499">
      </div>

      <div class="form-group">
        <label for="telefono_pago">Teléfono de Pago Móvil</label>
        <input type="text" id="telefono_pago" placeholder="Ej. 04128425733">
      </div>

      <div class="form-group">
        <label for="plan_id">Plan de Certificación</label>
        <select id="plan_id">
          <option value="basico">Plan Básico ($2/mes) - Sello Digital</option>
          <option value="pro">Plan Pro Top 3 ($4/mes) - QR HD + Podio WhatsApp</option>
          <option value="empresa">Plan Empresa ($12.50/mes) - Multi-sucursal</option>
        </select>
      </div>

      <button type="submit">Registrar y Certificar</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        tienda: document.getElementById('tienda').value,
        rif: document.getElementById('rif').value,
        propietario: document.getElementById('propietario').value,
        telefono: document.getElementById('telefono').value,
        direccion: document.getElementById('direccion').value,
        categoria: document.getElementById('categoria').value,
        instagram: document.getElementById('instagram').value,
        banco_pago: document.getElementById('banco_pago').value,
        cedula_pago: document.getElementById('cedula_pago').value,
        telefono_pago: document.getElementById('telefono_pago').value,
        plan_id: document.getElementById('plan_id').value
      };

      messageDiv.style.display = 'none';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && data.success) {
          messageDiv.textContent = '¡Comercio registrado con éxito! Redirigiendo...';
          messageDiv.className = 'success';
          messageDiv.style.display = 'block';

          setTimeout(() => {
            window.location.href = '/client-verify';
          }, 2000);
        } else {
          messageDiv.textContent = data.message || 'Error al registrar el comercio.';
          messageDiv.className = 'error';
          messageDiv.style.display = 'block';
        }
      } catch (error) {
        console.error('Error:', error);
        messageDiv.textContent = 'Error de conexión con el servidor.';
        messageDiv.className = 'error';
        messageDiv.style.display = 'block';
      }
    });
  </script>

</body>
</html>
