<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Verifik</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --input-bg: #334155;
      --border-color: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
      color: var(--accent-color);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .success {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .error {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #94a3b8;
    }

    .login-link a {
      color: var(--accent-color);
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Registro en Verifik</h2>
    
    <form id="registerForm">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="cedula">Cédula / Documento de Identidad</label>
        <input type="text" id="cedula" required placeholder="V-12345678">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit">Crear Cuenta</button>
    </form>

    <div id="message"></div>

    <div class="login-link">
      ¿Ya tienes cuenta? <a href="/index.html">Inicia sesión aquí</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value;
      const email = document.getElementById('email').value;
      const cedula = document.getElementById('cedula').value;
      const password = document.getElementById('password').value;

      messageDiv.style.display = 'none';
      messageDiv.className = '';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ nombre, email, cedula, password })
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.textContent = '¡Registro exitoso! Redirigiendo...';
          messageDiv.className = 'success';
          messageDiv.style.display = 'block';

          setTimeout(() => {
            window.location.href = '/index.html';
          }, 2000);
        } else {
          messageDiv.textContent = data.message || 'Error al registrar el usuario.';
          messageDiv.className = 'error';
          messageDiv.style.display = 'block';
        }
      } catch (error) {
        console.error('Error:', error);
        messageDiv.textContent = 'Error de conexión con el servidor.';
        messageDiv.className = 'error';
        messageDiv.style.display = 'block';
      }
    });
  </script>

</body>
</html>
