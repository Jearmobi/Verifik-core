<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifik Shield - Registrar Comercio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-400">Verifik Shield</h1>
      <p class="text-slate-400 text-sm mt-1">Alta de Nuevo Comercio</p>
    </div>

    <form id="register-form" class="space-y-4">
      <div>
        <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Nombre del Comercio</label>
        <input 
          type="text" 
          id="nombre" 
          placeholder="Ej. Farmacia San José" 
          required 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition"
        />
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Identificador único (Slug)</label>
        <input 
          type="text" 
          id="slug" 
          placeholder="Ej. farmacia-san-jose" 
          required 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition"
        />
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">RIF del Comercio</label>
        <input 
          type="text" 
          id="rif" 
          placeholder="Ej. J-987654321" 
          required 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition"
        />
      </div>

      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200 mt-2"
      >
        Registrar Comercio
      </button>
    </form>

    <!-- Caja de resultado -->
    <div id="result" class="hidden mt-6 p-4 rounded-lg bg-slate-900 border border-slate-700 text-sm">
      <p id="result-message" class="font-semibold text-green-400 mb-2"></p>
      <p class="text-xs text-slate-400">Enlace del punto de venta:</p>
      <a id="result-link" href="#" target="_blank" class="text-blue-400 underline text-xs break-all"></a>
    </div>
  </div>

  <script>
    // Auto-generar el slug en tiempo real a partir del nombre
    document.getElementById('nombre').addEventListener('input', (e) => {
      const slugInput = document.getElementById('slug');
      slugInput.value = e.target.value
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9-]/g, '-')
        .replace(/-+/g, '-');
    });

    // Manejar el envío del formulario
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value;
      const slug = document.getElementById('slug').value;
      const rif = document.getElementById('rif').value;

      try {
        const response = await fetch('/api/merchants/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug, nombre, rif })
        });

        const data = await response.json();

        const resultDiv = document.getElementById('result');
        const resultMsg = document.getElementById('result-message');
        const resultLink = document.getElementById('result-link');

        resultDiv.classList.remove('hidden');

        if (response.ok && data.exito) {
          resultMsg.className = "font-semibold text-green-400 mb-2";
          resultMsg.innerText = "¡Comercio registrado con éxito!";
          resultLink.href = data.comercio.urlPantalla;
          resultLink.innerText = data.comercio.urlPantalla;
          document.getElementById('register-form').reset();
        } else {
          resultMsg.className = "font-semibold text-red-400 mb-2";
          resultMsg.innerText = data.error || "Error al registrar el comercio.";
          resultLink.innerText = "";
        }
      } catch (err) {
        console.error('Error al conectar con la API:', err);
      }
    });
  </script>
</body>
</html>
