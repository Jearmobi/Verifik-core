<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifik Shield - Validación en Vivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Tarjeta Principal Verifik -->
  <div class="w-full max-w-sm bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 text-center">
    
    <!-- Encabezado / Logo -->
    <div class="flex justify-center items-center gap-2 mb-3">
      <span class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></span>
      <h1 class="text-xs font-bold tracking-widest text-slate-400 uppercase">Verifik Shield</h1>
    </div>

    <!-- Nombre del Comercio y RIF -->
    <h2 class="text-xl font-extrabold text-white mb-1" id="merchant-name">Tienda Oficial Demo</h2>
    <p class="text-xs text-slate-400 mb-4">RIF: J-123456789 • Maturín, Monagas</p>

    <!-- Código QR Dinámico -->
    <div class="bg-white p-3 rounded-xl shadow-inner mb-4 inline-block">
      <img id="qr-image" src="" alt="Cargando Código QR..." class="w-44 h-44 mx-auto" />
    </div>

    <!-- Indicador de Estado y Clave TOTP de 6 Dígitos -->
    <div id="status-card" class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3 mb-4">
      <p class="text-[10px] text-emerald-400 font-semibold uppercase tracking-wider mb-1">Código de Validación Temporal</p>
      <div class="text-emerald-400 text-2xl font-black tracking-wider" id="totp-code">--- ---</div>
    </div>

    <!-- Contador Regresivo -->
    <div class="mb-2">
      <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden mb-2">
        <div id="timer-bar" class="bg-emerald-500 h-full w-full transition-all duration-1000"></div>
      </div>
      <p class="text-[10px] text-slate-400">El token expira en <span id="timer-text" class="font-bold text-slate-200">30</span>s</p>
    </div>

    <!-- Footer de Transparencia -->
    <div class="text-[10px] text-slate-500 border-t border-slate-700/50 pt-3 mt-4">
      Validado mediante cifrado temporal TOTP (RFC 6238).
    </div>
  </div>

<script>
  let interval;

  async function obtenerQR() {
    try {
      if (interval) clearInterval(interval);

      // Extraer el ID de la tienda desde la URL actual
      const pathParts = window.location.pathname.split('/');
      const tiendaId = pathParts[pathParts.length - 1] || 'demo-tienda';

      const respuesta = await fetch(`/api/qr/${tiendaId}`);
      
      if (!respuesta.ok) {
        document.getElementById('totp-code').innerText = "ERROR";
        return;
      }

      const datos = await respuesta.json();
      
      // Actualizar datos del comercio dinámicamente
      if (datos.tienda) {
        const titleEl = document.querySelector('h1');
        if (titleEl) titleEl.innerText = datos.tienda;
      }

      if (datos.rif) {
        const rifEl = document.querySelector('p.text-xs');
        if (rifEl) rifEl.innerText = `RIF: ${datos.rif} • Maturín, Monagas`;
      }
      
      // Asignar imagen del QR y token
      document.getElementById('qr-image').src = datos.qr;

      if (datos.token) {
        const tokenFormateado = datos.token.slice(0, 3) + ' ' + datos.token.slice(3);
        document.getElementById('totp-code').innerText = tokenFormateado;
      }

      // Temporizador
      let timeLeft = datos.expiraEn;
      const timerText = document.getElementById('timer-text');
      const timerBar = document.getElementById('timer-bar');

      timerText.innerText = timeLeft;
      timerBar.style.width = ((timeLeft / 30) * 100) + '%';

      interval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(interval);
          obtenerQR();
        } else {
          timerText.innerText = timeLeft;
          timerBar.style.width = ((timeLeft / 30) * 100) + '%';
        }
      }, 1000);

    } catch (error) {
      console.error('Error al conectar con Verifik API:', error);
    }
  }

  obtenerQR();
</script>
</body>
</html>
